[package]
name = "snaptik"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
bytes = "1.11.1"
cookie_store = "0.22"
futures = "0.3.32"
itertools = "0.14.0"
rand = "0.10"
reqwest = { version = "0.13", features = ["cookies", "multipart", "stream", "json"] }
reqwest_cookie_store = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
